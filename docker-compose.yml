services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fangap
      POSTGRES_PASSWORD: fangap
      POSTGRES_DB: fangap
    ports:
      - "5432:5432"
    volumes:
      - fangap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fangap -d fangap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fangap_pgdata:
